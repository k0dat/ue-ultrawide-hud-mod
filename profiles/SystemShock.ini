; UEUltrawideHUDMod profile for System Shock (2023 remake, UE 4.27.2).
; Copy into Mods/UEUltrawideHUDMod.
;
; One widget holds the HUD, the pause menu, the boot and crash screens and the damage indicators,
; so the anchors method is used and everything that must stay full-screen is excluded. Only the
; HUD container RETAINER_ScreenEffects moves.

[General]
VirtualAspect=16:9
PollInterval=1
Debug=false

; Station HUD. The crosshair is excluded because the game re-anchors it itself.
; PANEL_Brackets is the selection box, which the game positions in full-screen coordinates.
[WIDGET_PlayerHUD]
Method=anchors
Exclude=PANEL_DamageIndicators,WIDGET_MainMenu_InGame,WIDGET_BootupScreen,WIDGET_CrashScreen,WIDGET_CrosshairCursor
Unshift=PANEL_Brackets

; Cyberspace HUD. PANEL_Camera holds the cyberspace pause menu.
[WIDGET_CyberspaceHUD]
Method=anchors
Exclude=PANEL_DamageIndicators,PANEL_Camera,WIDGET_CyberspaceOccularRing
