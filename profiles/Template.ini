; UEUltrawideHUDMod profile template. Copy it into Mods/UEUltrawideHUDMod and fill it in for your game.
; The mod loads the first .ini file in that folder, so keep only one there. Restart the game after editing.
; Write Key=value with no spaces around "=". Comments need their own line.

[General]
; Aspect ratio the HUD is moved into: W:H or a number such as 1.7778.
VirtualAspect=16:9
; Seconds between checks for new HUD widgets and resolution changes.
PollInterval=1
; true logs every anchor the mod writes to UE4SS.log.
Debug=false

; One section per HUD widget. The section name is the widget's class name from a dump
; (Ctrl+Del in game, then open widgets_*.txt in this folder). The "_C" suffix is optional.
;
; [WBP_PlayerHUD]
; viewport shrinks the whole widget. anchors moves each child of its first Canvas Panel.
; Method=viewport
; Hide elements parked off-screen for slide-in animations (default true).
; Clip=true
; anchors only: children to leave alone, such as menus and full-screen effects.
; Exclude=Vignette,PauseMenu
; anchors only: widgets the game positions in full-screen coordinates inside a moved container.
; Unshift=SelectionBox
