; UEUltrawideHUDMod profile for Echo Point Nova (UE 4.27.2).
; Copy into Mods/UEUltrawideHUDMod.
;
; Both HUD widgets hold only HUD elements, so the viewport method fits. Clipping hides the
; level-up panel while it is parked off-screen and lets it slide in at the 16:9 edge.

[General]
VirtualAspect=16:9
PollInterval=1
Debug=false

; Main HUD: XP bar, quest box, radar and health, weapons, messages.
[WBP_HUMANHUD]
Method=viewport

; [WB_ShooterHUD]
; Method=viewport
