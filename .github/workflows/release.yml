# Pushing a tag (e.g. `git tag 0.2 && git push origin 0.2`) runs the tests and
# publishes a GitHub release with one zip per game profile, plus a generic zip.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac

      - name: Run tests
        run: bash tests/run.sh

      - name: Build zips
        run: |
          mkdir dist
          # Each game zip has the profile already inside the mod folder, so it
          # only needs extracting into ue4ss/Mods.
          for ini in profiles/*.ini; do
            game="$(basename "$ini" .ini)"
            [ "$game" = Template ] && continue
            stage="$(mktemp -d)"
            cp -r src/UEUltrawideHUDMod "$stage/"
            cp "$ini" "$stage/UEUltrawideHUDMod/"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/UEUltrawideHUDMod-$GITHUB_REF_NAME-$game.zip" UEUltrawideHUDMod)
          done
          # The generic zip keeps the profiles outside the mod folder, because
          # the mod loads whichever .ini it finds first in its own folder.
          generic="$GITHUB_WORKSPACE/dist/UEUltrawideHUDMod-$GITHUB_REF_NAME.zip"
          (cd src && zip -qr "$generic" UEUltrawideHUDMod)
          zip -qr "$generic" profiles README.md COMPATIBILITY.md LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
